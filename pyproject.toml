[project]
name = "rag-eval"
version = "1.0.0"
description = "Automated offline evaluation of RAG pipelines through synthetic dataset generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "datasets>=3.0",
    "huggingface-hub>=0.23",
    "pytrec-eval-terrier>=0.5",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.5",
    "pylate>=1.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "sentencepiece>=0.2.1",
    "nltk>=3.9",
]

[tool.uv]
package = false
override-dependencies = ["torch>=2.5"]
